<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer le mot de passe | TAWASSOLI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b10;
            color: white;
            font-family: Arial, sans-serif;
        }
        .card {
            width: 90%;
            max-width: 420px;
            background: #17151e;
            padding: 30px;
            border-radius: 18px;
            border: 1px solid #38303d;
        }
        h2 { color: #ff91c8; text-align: center; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #514052;
            border-radius: 9px;
            background: #0b0b10;
            color: white;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #ff91c8;
            border: none;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #ff91c8; text-decoration: none; }
        .back { display: block; text-align: center; margin-top: 20px; }
        .message { padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .error { background: #55252d; }
        .success { background: #204b35; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Changer le mot de passe</h2>


    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}


<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <input type="password"
           name="current_password"
           placeholder="Mot de passe actuel"
           required
           autocomplete="current-password">

    <input type="password"
           name="new_password"
           placeholder="Nouveau mot de passe"
           required
           minlength="8"
           autocomplete="new-password">

    <input type="password"
           name="confirm_password"
           placeholder="Confirmer le nouveau mot de passe"
           required
           minlength="8"
           autocomplete="new-password">

    <button type="submit">
        Modifier le mot de passe
    </button>

</form>


    <a class="back" href="{{ url_for('settings') }}">← Retour aux paramètres</a>
</div>


</body>
</html>
