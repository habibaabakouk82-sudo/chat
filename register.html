
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAWASSOLI | Inscription</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b0b10;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            background: #17151e;
            border: 1px solid #302435;
            border-radius: 22px;
            text-align: center;
        }

        .logo {
            color: #ff91c8;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #bdb6c5;
            margin-bottom: 25px;
        }

        input {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #39303f;
            border-radius: 10px;
            background: #0b0b10;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #ff91c8;
            color: #17151e;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            color: #ff91c8;
            text-decoration: none;
        }

        .footer {
            margin-top: 24px;
            color: #bdb6c5;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            background: #302435;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo">TAWASSOLI</div>

        <p class="subtitle">Crée ton compte 💗</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">

            <!-- CSRF SECURITY TOKEN -->
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <input
                type="text"
                name="username"
                placeholder="Nom d'utilisateur"
                maxlength="30"
                autocomplete="username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Adresse e-mail"
                autocomplete="email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Mot de passe (8 caractères minimum)"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirmer le mot de passe"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Créer mon compte
            </button>

        </form>

        <p class="footer">
            Tu as déjà un compte ?

            <a href="{{ url_for('index') }}">
                Se connecter
            </a>
        </p>

    </main>

</body>
</html>
