<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confidentialité | TAWASSOLI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #0b0b10;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
        }

        .back {
            color: #ff91c8;
            text-decoration: none;
            font-size: 15px;
        }

        h1 {
            color: #ff91c8;
            margin-top: 30px;
        }

        .subtitle {
            color: #aaa;
            line-height: 1.6;
        }

        .card {
            background: #17151e;
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
            border: 1px solid #302735;
        }

        h2 {
            margin-top: 0;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            margin: 15px 0;
            border: 1px solid #39313e;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            border-color: #ff91c8;
            background: #211a25;
        }

        input[type="radio"] {
            accent-color: #ff91c8;
            width: 19px;
            height: 19px;
            margin-top: 3px;
        }

        strong {
            color: #ffb6dc;
            font-size: 17px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 0;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #ff91c8;
            color: #17151e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ffb6dc;
            transform: translateY(-2px);
        }

        .info {
            background: #211a25;
            border-left: 3px solid #ff91c8;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <a class="back" href="{{ url_for('settings') }}">
            ← Retour aux paramètres
        </a>

        <h1>Confidentialité du compte 🔒</h1>

        <p class="subtitle">
            Contrôle qui peut voir ton profil et tes publications
            sur TAWASSOLI.
        </p>

        <div class="card">

            <h2>Type de compte</h2>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label class="option">

                    <input
                        type="radio"
                        name="privacy"
                        value="public"
                        {% if not is_private %}checked{% endif %}
                    >

                    <div>
                        <strong>Compte public 🌍</strong>

                        <p>
                            Les utilisateurs connectés peuvent voir
                            tes publications.
                        </p>
                    </div>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="privacy"
                        value="private"
                        {% if is_private %}checked{% endif %}
                    >

                    <div>
                        <strong>Compte privé 🔐</strong>

                        <p>
                            Seuls tes amis peuvent voir ton profil
                            et tes publications.
                        </p>
                    </div>

                </label>


                <button type="submit">
                    Enregistrer les modifications
                </button>

            </form>

            <div class="info">
                <p>
                    💡 Tu peux modifier la confidentialité de ton
                    compte à tout moment.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
